name: Build Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          cache: true

      - name: Get Flutter Dependencies
        working-directory: android_app
        run: flutter pub get

      - name: Build Android Release APK
        working-directory: android_app
        run: flutter build apk --release

      - name: Rename & Prepare Artifact
        run: |
          mkdir -p release_output
          cp android_app/build/app/outputs/flutter-apk/app-release.apk release_output/AMA_Ceramics_Quotation_v2.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AMA_Ceramics_Quotation_v2.0_Android_APK
          path: release_output/AMA_Ceramics_Quotation_v2.0.apk
          if-no-files-found: error
          retention-days: 30
